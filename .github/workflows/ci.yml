name: MC3 Contract Baseline

on:
  push:
    branches:
      - chatgpt/mc3-contract-baseline-20261013
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pypdf python-docx openpyxl
      - run: python -m py_compile app/app.py app/parsers.py app/retrieval.py app/model.py app/server.py app/download_model.py
      - run: python -m pytest tests/test_contract.py -q
